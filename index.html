<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jingle Bowl · New Year Party Game</title>
<meta name="theme-color" content="#081127">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#081127;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.09);--line:rgba(255,255,255,.12);
  --text:#f3f5ff;--muted:#9fb0d8;--gold:#f4c25b;--gold2:#e0a12f;
  --red:#ef4b5c;--red2:#c22f44;--blue:#4aa3ff;--blue2:#2a74d6;--green:#21b47d;--green2:#16915f;
  --r:18px;--shadow:0 12px 40px rgba(0,0,0,.35);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
}
html,body{min-height:100%}
body{font-family:var(--font);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:#0a1430}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 600px at 50% -15%,rgba(244,194,91,.17),transparent 60%),
    radial-gradient(900px 520px at 105% 105%,rgba(33,180,125,.13),transparent 60%),
    radial-gradient(800px 520px at -5% 95%,rgba(239,75,92,.11),transparent 60%),
    linear-gradient(180deg,#081127,#0b1736 60%,#0a1430)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
input,textarea{font:inherit;color:var(--text)}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.flake{position:absolute;top:-20px;color:#fff;animation:fall linear infinite;user-select:none}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(300deg)}}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(14px,3vw,28px);position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(8,17,39,.92),rgba(8,17,39,.6));backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.35rem;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.orn{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6 0 12%,transparent 13%),radial-gradient(circle at 50% 50%,var(--red),var(--red2));
  position:relative;box-shadow:0 0 18px rgba(239,75,92,.5)}
.orn::before{content:"";position:absolute;top:-6px;left:9px;width:8px;height:7px;border-radius:2px;background:var(--gold)}
.brand em{font-style:normal;color:var(--gold)}
.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.82rem;font-weight:600;white-space:nowrap}
.pill.code b{letter-spacing:2px;color:var(--gold)}
.pill.demo{border-color:rgba(244,194,91,.5);color:var(--gold)}
.pill.me.team-red{border-color:rgba(239,75,92,.6)}.pill.me.team-blue{border-color:rgba(74,163,255,.6)}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:1rem}
.icon-btn:hover{background:var(--panel2)}
@media (max-width:640px){.pill.me,.pill.demo,.pill.code .lbl{display:none}.brand{font-size:1.15rem}.top-r{flex-wrap:nowrap}.top{padding:10px 14px}}
@media (hover:none){kbd,.kbd-hint{display:none}}

/* Layout */
main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:clamp(16px,3vw,32px) clamp(14px,3vw,28px) 120px;animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.4vw,24px);box-shadow:var(--shadow)}
.panel+.panel{margin-top:20px}
.panel h2,.h2{font-family:var(--display);font-size:1.35rem;font-weight:700;margin-bottom:12px}
.h3{font-size:.78rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:700;margin-bottom:10px}
.muted{color:var(--muted)}.small{font-size:.86rem}
.center{text-align:center}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:700;background:var(--panel2);border:1px solid var(--line);transition:transform .12s,filter .12s,background .2s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2b1a00;border-color:transparent;box-shadow:0 6px 22px rgba(244,194,91,.3)}
.btn.green{background:linear-gradient(180deg,var(--green),var(--green2));border-color:transparent}
.btn.red{background:linear-gradient(180deg,var(--red),var(--red2));border-color:transparent}
.btn.blue{background:linear-gradient(180deg,var(--blue),var(--blue2));border-color:transparent}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.lg{padding:16px 26px;font-size:1.08rem;border-radius:16px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:.9rem;transition:all .15s}
.chip.on{background:var(--gold);color:#2b1a00;border-color:var(--gold)}
.chip:disabled{opacity:1;cursor:default}.chip:disabled:not(.on){opacity:.55}
.mini{width:26px;height:26px;border-radius:8px;font-size:.8rem;background:rgba(255,255,255,.06);opacity:.7}
.mini:hover{opacity:1;background:rgba(255,255,255,.14)}
kbd{font-family:var(--font);font-size:.72rem;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.25);font-weight:700}

/* Inputs */
.field{display:block}
.field label{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
.input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);outline:none;font-size:1rem;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(244,194,91,.15)}
.input.code{text-transform:uppercase;letter-spacing:6px;font-weight:800;text-align:center;font-size:1.2rem}
textarea.input{min-height:110px;resize:vertical}
.word-row{display:flex;gap:8px}.word-row .input{flex:1}
.btn.dice{padding:0;width:52px;flex:none;font-size:1.3rem}
.err{color:#ffb3bb;background:rgba(239,75,92,.12);border:1px solid rgba(239,75,92,.35);padding:10px 14px;border-radius:12px;font-size:.9rem}
.note{color:#ffe6ad;background:rgba(244,194,91,.1);border:1px solid rgba(244,194,91,.3);padding:10px 14px;border-radius:12px;font-size:.88rem}

/* Home */
.hero{text-align:center;padding:clamp(10px,4vw,40px) 0 26px}
.hero-badge{display:inline-block;padding:6px 14px;border-radius:999px;border:1px solid rgba(244,194,91,.45);color:var(--gold);font-weight:700;font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,9vw,5.4rem);line-height:1;margin:16px 0 10px;letter-spacing:-1px}
.hero h1 em{font-style:normal;background:linear-gradient(180deg,#ffe29a,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:560px;margin:0 auto;color:var(--muted);font-size:1.05rem}
.home-card{max-width:560px;margin:0 auto}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem;font-weight:700;letter-spacing:1px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:600px;margin:30px auto 0}
@media (max-width:700px){.rules{grid-template-columns:1fr}}
.rule{padding:18px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.rule .ic{font-size:1.6rem}.rule b{display:block;margin:6px 0 4px;font-family:var(--display);font-size:1.1rem}
.rule p{color:var(--muted);font-size:.9rem}

/* Lobby */
.codebox{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.bigcode{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,7vw,3.4rem);letter-spacing:10px;color:var(--gold);line-height:1}
.link{font-size:.85rem;color:var(--muted);word-break:break-all;margin-top:6px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.teams{grid-template-columns:1fr}}
.team-col{border-radius:16px;padding:14px;border:1px solid var(--line);background:rgba(0,0,0,.15);display:flex;flex-direction:column;gap:10px}
.team-col.t-red{border-color:rgba(239,75,92,.45);background:linear-gradient(180deg,rgba(239,75,92,.14),rgba(0,0,0,.1))}
.team-col.t-blue{border-color:rgba(74,163,255,.45);background:linear-gradient(180deg,rgba(74,163,255,.14),rgba(0,0,0,.1))}
.team-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.05rem}
.count{min-width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:.85rem}
.plist{list-style:none;display:flex;flex-direction:column;gap:6px;flex:1}
.plist li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;background:rgba(255,255,255,.04);animation:fadeUp .3s ease both}
.plist li.off{opacity:.5}
.plist li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.plist li .nm i{font-style:normal;color:var(--muted);font-weight:500}
.plist li.empty{background:none;color:var(--muted);font-size:.9rem;justify-content:center}
.av{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:hsl(var(--h) 55% 45%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.unassigned{margin-top:14px}
.unassigned .tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.07);font-size:.88rem;font-weight:600}
.set-row{margin-bottom:16px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:left}
.mode b{display:block;font-size:.98rem}.mode span{font-size:.8rem;color:var(--muted)}
.mode.on{border-color:var(--gold);background:rgba(244,194,91,.12);box-shadow:0 0 0 3px rgba(244,194,91,.12)}
.mode:disabled{opacity:1;cursor:default}.mode:disabled:not(.on){opacity:.55}

/* Submit */
.bowl{width:180px;height:180px;margin:6px auto 14px;border-radius:50%;position:relative;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.22),transparent 30%),radial-gradient(circle at 50% 70%,rgba(74,163,255,.22),rgba(255,255,255,.04) 70%);
  border:2px solid rgba(255,255,255,.22);box-shadow:inset 0 -18px 40px rgba(74,163,255,.18),0 18px 50px rgba(0,0,0,.35)}
.bowl::before{content:"";position:absolute;top:-6px;left:28%;right:28%;height:14px;border-radius:999px;border:2px solid rgba(255,255,255,.25);background:#0b1736}
.bowl b{display:block;font-family:var(--display);font-size:3rem;line-height:1}
.bowl span{font-size:.78rem;color:var(--muted);font-weight:600}
.progress{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7fe0b5);border-radius:inherit;transition:width .5s ease}
.ready-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ready-list .tag.done{background:rgba(33,180,125,.18);color:#bff3dc}
.mywords{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.08);font-weight:600;font-size:.92rem;animation:pop .35s ease both}
.wchip.ok{background:rgba(33,180,125,.18);color:#c9f7e4}
.nw{white-space:nowrap}
.chip.banned,.pill.banned{text-decoration:line-through;opacity:.45}
.clue-rules{margin:0;padding-left:20px;line-height:1.6}
.clue-head{margin-bottom:16px}
.clue-split>.panel,.clue-split>.panel+.panel{margin:0}
.clue-team h3{margin:0 0 8px}
.clue-team.t-red{border-left:4px solid var(--red)}.clue-team.t-blue{border-left:4px solid var(--blue)}
.clue-timer{text-align:center;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.clue-timer b{font-family:var(--display, inherit);font-size:2.6rem;display:block;line-height:1}
.clue-timer span{font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.clue-timer .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}
.clue-timer .bar i{display:block;height:100%;background:var(--gold);transform-origin:left}
.clue-timer.urgent b{color:var(--red)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{padding:22px 10px;border-radius:16px;background:#fffdf6;color:#1b2142;font-weight:800;font-size:1.35rem;border:3px solid transparent;transition:transform .15s}
.opt:hover{transform:translateY(-2px);border-color:var(--gold)}
.clue-word{display:inline-block;margin:6px 0 14px;padding:10px 26px;border-radius:14px;background:#fffdf6;color:#1b2142;font-weight:800;font-size:1.8rem}
.clue-form{display:grid;gap:10px;margin-top:6px}
.clue-form input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:inherit;font-size:1.1rem}
.clue-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.clue-meta .bad{color:#ff8a95;font-weight:600}
.clue-big{font-size:1.5rem;font-weight:700;margin:8px 0;line-height:1.3}
.locked{color:#7be0b3;font-weight:600}
.clue-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.clue-half.t-red{border-top:4px solid var(--red)}.clue-half.t-blue{border-top:4px solid var(--blue)}
.clue-answer-word{margin:6px 0 12px;font-size:1.1rem}.clue-answer-word b{background:#fffdf6;color:#1b2142;padding:3px 12px;border-radius:8px}
.ans-list{display:grid;gap:6px;margin-top:8px}
.ans{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.06);text-align:left;animation:pop .35s ease both;font-size:.95rem}
.ans span{color:var(--muted)}.ans.none i{color:var(--muted)}
.ans.ok{background:rgba(33,180,125,.18)}.ans.ok b{color:#7be0b3}
.ans.no{background:rgba(239,75,92,.14)}.ans.no b{color:#ff9aa5;text-decoration:line-through}
.ans.tog{cursor:pointer;border:1px dashed rgba(255,255,255,.25)}
.host-panel p{margin:6px 0 12px;line-height:1.6}
@media (max-width:760px){.clue-split{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}
.wchip.time{background:rgba(244,194,91,.14);color:#f6dba0}
.wchip.skip{background:rgba(255,255,255,.06);color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* Scoreboard */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.sc{border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);transition:box-shadow .3s,transform .3s}
.sc.t-red{background:linear-gradient(135deg,rgba(239,75,92,.28),rgba(239,75,92,.08));border-color:rgba(239,75,92,.45)}
.sc.t-blue{background:linear-gradient(135deg,rgba(74,163,255,.28),rgba(74,163,255,.08));border-color:rgba(74,163,255,.45)}
.sc.active{box-shadow:0 0 0 3px var(--gold),0 0 30px rgba(244,194,91,.3)}
.sc-name{font-weight:800}
.sc b{font-family:var(--display);font-size:2.2rem;line-height:1}
.sc b.pop{animation:pop .45s ease both}
.vs{color:var(--muted);font-weight:800;font-size:.8rem}

/* Round banner */
.round{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:linear-gradient(135deg,rgba(244,194,91,.16),rgba(244,194,91,.04));border:1px solid rgba(244,194,91,.35)}
.round .ic{font-size:2rem}
.round b{font-family:var(--display);font-size:1.15rem}
.round p{color:#f3e2bd;font-size:.9rem}

/* Up next */
.upnext{text-align:center;padding:clamp(20px,4vw,36px)}
.upnext .av{width:84px;height:84px;font-size:2rem;margin:4px auto 12px;box-shadow:0 0 0 5px rgba(255,255,255,.08),0 0 40px rgba(244,194,91,.25)}
.upnext h2{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.3rem);margin-bottom:4px}
.team-label{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:800;font-size:.8rem;letter-spacing:1px;text-transform:uppercase}
.team-label.t-red{background:rgba(239,75,92,.22);color:#ffc0c7}
.team-label.t-blue{background:rgba(74,163,255,.22);color:#c4e1ff}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}

/* Summary */
.summary{border-radius:16px;padding:16px;border:1px solid var(--line);background:rgba(0,0,0,.18)}
.summary.t-red{border-left:4px solid var(--red)}.summary.t-blue{border-left:4px solid var(--blue)}
.sum-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.sum-pts{font-family:var(--display);font-size:1.5rem;color:var(--gold)}
.sum-sub{color:var(--muted);font-size:.88rem;margin:2px 0 10px}
.sum-words{display:flex;flex-wrap:wrap;gap:6px}

/* Explainer */
.ex{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 200px)}
.ex-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer-big{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;min-width:90px;text-align:right;transition:color .3s}
.timer-big.urgent{color:var(--red);animation:pulse 1s ease infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.timerbar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.timerbar i{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,var(--gold),#ffe29a);transition:transform .25s linear}
.urgent .timerbar i,.timerbar.urgent i{background:linear-gradient(90deg,var(--red),#ff8a95)}
.cardstage{flex:1;display:grid;place-items:center;perspective:1000px;padding:10px 0}
.wordcard{width:min(100%,560px);min-height:clamp(220px,40vh,320px);border-radius:26px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;
  background:linear-gradient(160deg,#fffdf6,#f4ead3);color:#1b2142;box-shadow:0 30px 70px rgba(0,0,0,.45),inset 0 0 0 8px rgba(255,255,255,.6),inset 0 0 0 10px rgba(224,161,47,.5);
  animation:dealIn .45s cubic-bezier(.2,.9,.3,1.2) both;position:relative}
.wordcard::before,.wordcard::after{content:"❄";position:absolute;font-size:1.2rem;color:rgba(224,161,47,.55)}
.wordcard::before{top:18px;left:22px}.wordcard::after{bottom:18px;right:22px}
@keyframes dealIn{from{opacity:0;transform:translateY(40px) rotateX(25deg) rotate(-3deg) scale(.9)}to{opacity:1;transform:none}}

/* ---------- Safe storage (some embedded/private browsers block it) ---------- */
function safeStore(kind) {
  const mem = new Map();
  let real = null; try { real = window[kind]; const t = "__jb"; real.setItem(t, "1"); real.removeItem(t); } catch { real = null; }
  return {
    getItem: k => { try { return real ? real.getItem(k) : mem.get(k) ?? null; } catch { return mem.get(k) ?? null; } },
    setItem: (k, v) => { mem.set(k, String(v)); try { real && real.setItem(k, v); } catch {} },
    removeItem: k => { mem.delete(k); try { real && real.removeItem(k); } catch {} },

/* ---------- Backends ---------- */
// Local demo backend: localStorage + storage events (syncs tabs of the same browser).
class LocalBackend {
  constructor() {
    this.key = "jinglebowl_demo_db"; this.subs = [];
    window.addEventListener("storage", e => { if (e.key === this.key) this.emit(); });
  }
  load() { try { return JSON.parse(LS.getItem(this.key)) || {}; } catch { return {}; } }
  save(d) { LS.setItem(this.key, JSON.stringify(d)); this.emit(); }
  getAt(d, path) { return path.split("/").filter(Boolean).reduce((o, k) => (o == null ? undefined : o[k]), d); }
  setAt(d, path, v) {
    const ks = path.split("/").filter(Boolean); let o = d;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== "object" || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }

    if (v === null || v === undefined) delete o[last]; else o[last] = clone(v);
  }
  async get(p) { return clone(this.getAt(this.load(), p)) ?? null; }
  async set(p, v) { const d = this.load(); this.setAt(d, p, v); this.save(d); }
  async update(p, obj) { const d = this.load(); for (const [k, v] of Object.entries(obj)) this.setAt(d, p + "/" + k, v); this.save(d); }
  async transaction(p, fn) {
    const d = this.load(); const res = fn(clone(this.getAt(d, p)) ?? null);
    if (res === undefined) return { committed: false };
    this.setAt(d, p, res); this.save(d); return { committed: true };
  }
  subscribe(p, cb) {
    const s = { last: undefined };
    s.fire = () => { const v = this.getAt(this.load(), p); const j = JSON.stringify(v ?? null); if (j !== s.last) { s.last = j; cb(JSON.parse(j)); } };
    this.subs.push(s); s.fire();
    return () => { this.subs = this.subs.filter(x => x !== s); };
  }
  emit() { this.subs.forEach(s => s.fire()); }
  now() { return Date.now(); }
  presence() { return () => {}; }
}

// Firebase Realtime Database backend.
class FirebaseBackend {
  async init() {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
    const appMod = await import(base + "firebase-app.js");
    this.m = await import(base + "firebase-database.js");
    this.db = this.m.getDatabase(appMod.initializeApp(FIREBASE_CONFIG));
    this.offset = 0;
    this.m.onValue(this.r(".info/serverTimeOffset"), s => { this.offset = s.val() || 0; });
  }
  r(p) { return this.m.ref(this.db, p); }
  async get(p) { return (await this.m.get(this.r(p))).val(); }
  set(p, v) { return this.m.set(this.r(p), clone(v) ?? null); }
  update(p, o) { return this.m.update(this.r(p), clone(o)); }
  async transaction(p, fn) { const res = await this.m.runTransaction(this.r(p), cur => fn(cur)); return { committed: res.committed }; }
  subscribe(p, cb) { return this.m.onValue(this.r(p), s => cb(s.val())); }
  now() { return Date.now() + this.offset; }
  presence(path) {
    const ref = this.r(path);
    const off = this.m.onValue(this.r(".info/connected"), s => {
      if (s.val() === true) {
        this.m.onDisconnect(ref).update({ online: false, offlineAt: this.m.serverTimestamp() });
        this.m.update(ref, { online: true, offlineAt: null });
      }
    });
    return () => { off(); this.m.onDisconnect(ref).cancel(); };
  }

function balanceTeams(randomize) {
  const { players } = ctx();
  const upd = {};
  if (randomize) {
    shuffle(Object.keys(players)).forEach((id, i) => { upd[`${id}/team`] = i % 2 ? "blue" : "red"; });
  } else {
    const red = teamList(players, "red"), blue = teamList(players, "blue");
    for (const id of teamList(players, null)) { (red.length <= blue.length ? red : blue).push(id); upd[`${id}/team`] = red.includes(id) ? "red" : "blue"; }
    while (Math.abs(red.length - blue.length) > 1) {
      const [from, to, t] = red.length > blue.length ? [red, blue, "blue"] : [blue, red, "red"];
      const id = from.pop(); to.push(id); upd[`${id}/team`] = t;
    }
  }
  if (Object.keys(upd).length) S.db.update(roomPath("players"), upd);
  toast(randomize ? "Teams shuffled 🎲" : "Teams balanced ⚖️");

  return `<section class="hero">

      <h1>Jingle <em>Bowl</em></h1>
      <p class="lead">Two teams, one clock: explain the words, then draw them. Everyone gets a turn!</p>
    </section>
    <section class="panel home-card">
      ${S.fatal ? `<div class="err" style="margin-bottom:14px">${esc(S.fatal)}</div>` : ""}
      ${S.notice ? `<div class="note" style="margin-bottom:14px">${esc(S.notice)}</div>` : ""}
      ${S.demo ? `<div class="note" style="margin-bottom:14px">🧪 <b>Demo mode.</b> Firebase isn't configured yet, so players sync only between tabs of this browser. Open this page in a few tabs and join each one with the room code to try it out.</div>` : ""}
      <form data-submit="home" class="stack" autocomplete="off">
        <div class="field"><label for="nm">Your nickname</label>
          <input id="nm" class="input" data-model="name" maxlength="20" placeholder="e.g. Snow Queen" value="${esc(S.drafts.name)}" autofocus></div>
        ${inv ? `
          <div class="center muted">You're invited to room <b style="color:var(--gold);letter-spacing:3px">${esc(S.drafts.code)}</b></div>
          <button type="submit" class="btn gold lg wide" ${S.loading ? "disabled" : ""}>${S.loading ? "Joining…" : "🎉 Join the party"}</button>
        ` : `
          <button type="button" class="btn gold lg wide" data-action="create" ${S.loading ? "disabled" : ""}>🎄 Create a room</button>
          <div class="or">OR JOIN</div>
          <div class="row" style="flex-wrap:nowrap">
            <input id="cd" class="input code" data-model="code" maxlength="4" placeholder="CODE" value="${esc(S.drafts.code)}" style="flex:1" autocapitalize="characters">
            <button type="submit" class="btn blue lg" ${S.loading ? "disabled" : ""}>Join</button>
          </div>`}
        ${S.error ? `<div class="err">${esc(S.error)}</div>` : ""}
      </form>
    </section>
    ${rulesCards()}`;
}

function teamCol(team) {
  const { players, me, isHost, hostId } = ctx();
  const ids = teamList(players, team);
  return `<div class="team-col t-${team}">
    <div class="team-head"><span>${TEAMS[team].emoji} ${TEAMS[team].name}</span><span class="count">${ids.length}</span></div>
    <ul class="plist">${ids.map(id => playerLi(id, players[id], isHost, hostId)).join("") || `<li class="empty">No players yet</li>`}</ul>
    ${me && me.team !== team ? `<button class="btn ${team} wide" data-action="team" data-team="${team}">Join ${TEAMS[team].name}</button>` : ""}
  </div>`;
}
function playerLi(id, p, isHost, hostId) {
  return `<li data-key="p-${id}" class="${p.online === false ? "off" : ""}">${avatar(p.name)}
    <span class="nm">${esc(p.name)}${id === hostId ? " 👑" : ""}${id === S.pid ? " <i>(you)</i>" : ""}</span>
    ${isHost && id !== S.pid ? `<button class="mini" data-action="make-host" data-pid="${id}" title="Make host">👑</button><button class="mini" data-action="swap" data-pid="${id}" title="Move to other team">⇄</button><button class="mini" data-action="kick" data-pid="${id}" title="Remove player">✕</button>` : ""}
  </li>`;
}

function settingsPanel() {
  const { settings: st, isHost, players } = ctx();
  const draw = hasDraw(st.mode), clue = st.mode === "clue";
  const red = teamList(players, "red").length, blue = teamList(players, "blue").length;
  const n = Object.keys(players).length;
  const perTeam = Math.max(red, blue, Math.ceil(n / 2), 1);
  const turns = perTeam * 2;
  const mins = secs => Math.round(turns * (secs + 15) / 60);
  const est = `Each round: everyone explains once → ${turns} turns (~${mins(st.timer)} min${draw ? `; drawing round ~${mins(st.drawTimer)} min` : ""}${clue ? "; 🧩 One Clue ~5 min" : ""}).`;
  const uneven = red && blue && red !== blue ? `<p class="small muted" style="margin-top:6px">${TEAMS[red < blue ? "red" : "blue"].name} has fewer players, so ${Math.abs(red - blue) === 1 ? "one of them explains" : "some of them explain"} twice per round to keep it fair.</p>` : "";
  if (!isHost) {
    // Players only see a short read-only summary; the full panel is for the host.
    const pill = t => `<span class="pill">${t}</span>`;
    return `<div class="panel"><h2>Game rules</h2><div class="row">
      ${pill(clue ? "💬 Alias + 🎨 Draw + 🧩 One Clue · 3 rounds" : draw ? "💬 Alias + 🎨 Draw · 2 rounds" : "💬 Alias · 1 round")}
      ${pill(`⏱ ${st.timer}s to explain`)}
      ${draw ? pill(`🎨 ${st.drawTimer}s to draw`) : ""}
      ${draw && (st.drawPts || 1) > 1 ? pill(`🎨 ${st.drawPts} points per drawn word`) : ""}
      ${pill(`✗ ${st.skipLimit > 0 ? st.skipLimit : "Unlimited"} skip${st.skipLimit === 1 ? "" : "s"} per turn`)}
      ${clue ? pill(`🧩 Clue: max ${st.clueWords} words · ${st.clueTime}s to write · ${st.guessTime}s to guess`) : ""}
    </div><p class="small muted" style="margin-top:10px">${est} Set by the host.</p>${uneven}</div>`;
  }
  const chip = (k, v, label) => `<button class="chip ${st[k] == v ? "on" : ""}" data-action="setting" data-k="${k}" data-v="${v}">${label}</button>`;
  const mode = (v, t, s) => `<button class="mode ${st.mode === v ? "on" : ""}" data-action="setting" data-k="mode" data-v="${v}"><b>${t}</b><span>${s}</span></button>`;
  return `<div class="panel">
    <h2>Game settings</h2>
    <div class="set-row"><div class="h3">Game mode</div><div class="modes">
      ${mode("draw", "Alias + Draw", "2 rounds · 💬 explain, then 🎨 draw")}
      ${mode("clue", "Alias + Draw + Clue", "3 rounds · 💬 → 🎨 → 🧩 One Clue")}
      ${mode("alias", "Alias", "1 round · 💬 explain only")}
    </div></div>
    <div class="set-row"><div class="h3">💬 Time to explain</div><div class="row">${[45, 60, 90].map(v => chip("timer", v, v + "s")).join("")}</div></div>
    ${draw ? `<div class="set-row"><div class="h3">🎨 Time to draw</div><div class="row">${[60, 90, 120].map(v => chip("drawTimer", v, v + "s")).join("")}</div></div>
    <div class="set-row"><div class="h3">🎨 Points per drawn word</div><div class="row">${[1, 2, 3].map(v => chip("drawPts", v, "×" + v)).join("")}</div></div>` : ""}
    ${clue ? `<div class="set-row"><div class="h3">🧩 Words in a clue</div><div class="row">${[3, 4, 5, 6, 7].map(v => chip("clueWords", v, v)).join("")}</div></div>
    <div class="set-row"><div class="h3">🧩 Time to write a clue</div><div class="row">${[45, 60, 90].map(v => chip("clueTime", v, v + "s")).join("")}</div></div>
    <div class="set-row"><div class="h3">🧩 Time to guess</div><div class="row">${[45, 60, 90].map(v => chip("guessTime", v, v + "s")).join("")}</div></div>
    <div class="set-row"><div class="h3">🧩 Points for a correct answer</div><div class="row">${[2, 3, 5].map(v => chip("cluePts", v, v)).join("")}</div></div>` : ""}
    <div class="set-row"><div class="h3">Skips per turn</div><div class="row">${[1, 2, 3, 5].map(v => chip("skipLimit", v, v)).join("")}${chip("skipLimit", 0, "∞")}</div></div>
    <div class="set-row"><div class="h3">Word packs · ${packWords().length} words</div><div class="row">${PACK_IDS.map(id => `<span class="pill">${PACKS[id].icon} ${PACKS[id].name}</span>`).join("")}</div></div>
    <p class="small muted">${est}</p>${uneven}
  </div>`;
}

function teamPickBanner() {
  const { me, g } = ctx();
  if (!me || me.team || g.phase === "lobby") return "";
  return `<div class="teampick"><b>👋 Pick a team — you'll get a turn from the next round:</b><div class="row">
    <button class="btn red" data-action="team" data-team="red">${TEAMS.red.emoji} ${TEAMS.red.name}</button>
    <button class="btn blue" data-action="team" data-team="blue">${TEAMS.blue.emoji} ${TEAMS.blue.name}</button></div></div>`;
}

function viewLobby() {
  const { players, isHost, settings } = ctx();
  const none = teamList(players, null);
  return `<div class="grid2">
    <div>
      <div class="panel">
        <div class="codebox">
          <div><div class="h3">Room code</div><div class="bigcode">${S.code}</div><div class="link">${esc(inviteLink())}</div></div>
          <div class="row"><button class="btn gold" data-action="copy">🔗 Copy invite link</button>${navigator.share ? `<button class="btn" data-action="share">Share</button>` : ""}</div>
        </div>
      </div>
      <div class="panel">
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          <h2 style="margin:0">Teams <span class="muted small">· ${Object.keys(players).length} players</span></h2>
          ${isHost ? `<div class="row"><button class="btn" data-action="balance">⚖️ Auto-balance</button><button class="btn" data-action="shuffle">🎲 Shuffle</button></div>` : ""}
        </div>
        <div class="teams">${teamCol("red")}${teamCol("blue")}</div>
        ${none.length ? `<div class="unassigned"><div class="h3">Choosing a team…</div><div class="tags">${none.map(id => `<span class="tag" data-key="u-${id}">${avatar(players[id].name)}${esc(players[id].name)}${id === S.pid ? " (you)" : ""}${isHost && id !== S.pid ? `<button class="mini" data-action="kick" data-pid="${id}" title="Remove player">✕</button>` : ""}</span>`).join("")}</div></div>` : ""}
      </div>
    </div>
    <div>
      ${settingsPanel()}
      <div class="panel stack">
        ${isHost ? `<button class="btn gold lg wide" data-action="start">🚀 Start the game</button>
          <p class="small muted center">Start once everyone has joined and picked a team.</p>`
        : `<div class="center muted">⏳ Waiting for the host to start…</div>`}
        <details class="howto"><summary>How to play</summary><ol>
          <li>Teams take turns. One player explains, their team guesses before the timer runs out.</li>
          <li>${hasDraw(settings.mode) ? "Round 1: explain with words. Round 2: draw new words. Don't write the secret word. You can only say Yes, No, Close." : "Explain with words — never say the word or any part of it."}</li>
          <li><b>Correct</b> = +1 point${hasDraw(settings.mode) && (settings.drawPts || 1) > 1 ? ` (${settings.drawPts} points in the Draw round)` : ""}. <b>Skip</b> = next word (limited per turn). Wrong button? Tell the host — they fix it right after the turn.</li>
          <li>Everyone explains once per round. After each round the host checks the answers with everyone.</li>
          ${settings.mode === "clue" ? `<li>Round 3 · 🧩 One Clue: one player per team writes a clue of up to ${settings.clueWords} words; teammates get one silent guess each. More correct answers = more points!</li>` : ""}
        </ol></details>
      </div>
    </div>
  </div>`;
}

function scoreboard(g) {
  const { sc } = tally(g); const r = sc.red || 0, b = sc.blue || 0;
  const act = t => (g.phase === "turn" || g.phase === "between") && g.turnTeam === t ? "active" : "";
  return `<div class="score">
    <div class="sc t-red ${act("red")}"><span class="sc-name">${TEAMS.red.emoji} ${TEAMS.red.short}</span><b class="pop" data-key="sr-${r}">${r}</b></div>
    <div class="vs">VS</div>
    <div class="sc t-blue ${act("blue")}"><span class="sc-name">${TEAMS.blue.emoji} ${TEAMS.blue.short}</span><b class="pop" data-key="sb-${b}">${b}</b></div>
  </div>`;
}

function roundBanner(g) {
  const ri = roundInfo(g); const total = g.totalRounds || 1;
  return `<div class="round"><span class="ic">${ri.icon}</span><div><b>${total > 1 ? `Round ${g.round || 1} of ${total} · ` : ""}${ri.name}</b><p>${ri.rule}${drawPtsNote(roundPts(g, g.round || 1))}</p></div></div>`;
}

const REASONS = { time: "⏰ Time's up!", host: "⏹ Ended by the host", deck: "🃏 Out of words!", gaveup: "🏳️ Ended early" };
const MARK = { ok: "✓", skip: "✗", time: "⏱" };
function wordChips(log, opts = {}) {
  return arr(log).map((x, i) => {
    const r = MARK[x.r] ? x.r : "skip";
    const cls = `wchip ${r}${opts.edit ? " tog" : ""}`;
    const txt = `${MARK[r]} ${esc(x.w)}${x.edited ? " ✏️" : ""}`;
    const tip = r === "time" ? "Unfinished word: tap to count it ✓" : "Switch ✓ / ✗";
    return opts.edit ? `<button class="${cls}" data-action="toggle" data-t="${opts.ti}" data-w="${i}" title="${tip}">${txt}</button>` : `<span class="${cls}" ${r === "time" ? `title="Unfinished: time ran out or the turn ended"` : ""}>${txt}</span>`;
  }).join("");
}
function turnSummary(t, opts = {}) {
  if (!t) return "";
  const log = arr(t.log); const n = r => log.filter(x => x.r === r).length; const ok = n("ok"), un = n("time"); const k = opts.mult || 1;
  return `<div class="summary t-${t.team}">
    <div class="sum-head"><span>${esc(t.name)} · ${TEAMS[t.team]?.name || ""}</span><span class="sum-pts">+${ok * k}</span></div>
    <div class="sum-sub">${[REASONS[t.reason] || "", `${ok} guessed${k > 1 ? ` × ${k} pts` : ""}`, `${log.length - ok - un} skipped`, un ? `⏱ ${un} unfinished` : ""].filter(Boolean).map(x => `<span class="nw">${x}</span>`).join(" · ")}</div>
    <div class="sum-words">${wordChips(log, opts)}${!log.length ? `<span class="muted small">The turn ended before any word was shown.</span>` : ""}</div>
  </div>`;
}

function viewBetween() {
  const { g, players, isHost } = ctx();
  const ex = players[g.explainer]; const isMe = g.explainer === S.pid; const team = g.turnTeam;
  const drawing = roundKind(g) === "draw";
  return `${teamPickBanner()}<div class="grid2">
    <div class="stack">
      ${roundBanner(g)}
      <div class="panel upnext">
        <div class="h3">Up next · ${turnLabel(g)}</div>
        ${ex ? avatar(ex.name) : ""}
        <h2>${ex ? (isMe ? (drawing ? "Your turn to draw! 🎨" : "You're up! 🎤") : esc(ex.name)) : "No player available"}</h2>
        <span class="team-label t-${team}">${TEAMS[team].emoji} ${TEAMS[team].name} guesses</span>
        ${ex && ex.online === false && isHost ? `<div class="note small" style="margin-top:14px">${esc(ex.name)} seems offline. Use <b>Skip Current Player</b> below if they're away.</div>` : ""}
        <div style="margin-top:20px" class="stack">
          ${isMe ? `<button class="btn gold lg wide" data-action="start-turn">▶ Start my turn</button>
              <p class="small muted kbd-hint">Desktop shortcuts: <kbd>Space</kbd> = Correct, <kbd>S</kbd> = Skip</p>`
            : isHost ? `<button class="btn lg wide" data-action="start-turn" ${ex ? "" : "disabled"}>▶ Start turn for ${ex ? esc(ex.name) : "…"}</button>
              <p class="small muted">Or wait for ${ex ? esc(ex.name) : "the player"} to press start.</p>`
            : `<p class="muted">⏳ Waiting for ${ex ? esc(ex.name) : "the next player"} to start…</p>`}
        </div>
      </div>
    </div>
    <div class="stack">
      ${scoreboard(g)}
      ${(() => { const turns = arr(curRound(g).turns); const ti = turns.length - 1; if (ti < 0) return "";
        return `<div class="h3" style="margin-top:8px">Last turn</div>${isHost ? `<p class="small muted" style="margin:0 0 6px">Wrong mark? Tap a word to fix it: ✓ / ✗, or ⏱ → ✓.</p>` : ""}<div data-key="lt-${g.round}-${ti}">${turnSummary(turns[ti], { edit: isHost, ti, mult: roundPts(g, g.round || 1) })}</div>`; })()}
    </div>
  </div>`;
}

function timerState(g) {
  const ms = remainingMs(g); const total = (g.turnSecs || 60) * 1000;
  const sec = Math.max(0, Math.ceil(ms / 1000));
  return { sec, frac: clamp(ms / total, 0, 1), urgent: sec <= 10 ? "urgent" : "" };
}

function turnControls(g) {
  const log = arr(g.log); const ok = log.filter(x => x.r === "ok").length; const sl = skipsLeft(g);
  return `<div class="ex-meta"><span class="pill">${turnLabel(g)}</span><span class="pill">✓ ${ok} this turn</span><span class="pill">✗ ${log.length - ok} skipped</span></div>
    <div class="ex-btns">
      <button class="btn skipb" data-action="skip" ${sl <= 0 ? "disabled" : ""}>✗ Skip <kbd>S</kbd>${sl === Infinity ? "" : `<small>${sl} left</small>`}</button>
      <button class="btn correctb" data-action="correct">✓ Correct <kbd>Space</kbd></button>
    </div>
    <div class="center"><button class="btn ghost endmine" data-action="end-my-turn">🏳️ End my turn</button></div>
    ${hostBar(true)}`;
}

function viewExplainer() {
  const { g } = ctx(); const t = timerState(g); const ri = roundInfo(g);
  const w = g.current || ""; const len = w.length > 24 ? "xlong" : w.length > 13 ? "long" : "";
  const top = `<div class="ex-top">
      <div><span class="team-label t-${g.turnTeam}">${TEAMS[g.turnTeam].emoji} ${TEAMS[g.turnTeam].name}</span>
        <div class="small muted" style="margin-top:6px">${ri.icon} ${(g.totalRounds || 1) > 1 ? `Round ${g.round} · ` : ""}${ri.name}</div></div>
      <div class="timer-big ${t.urgent}" data-urgent><span data-timer>${t.sec}</span>s</div>
    </div>
    <div class="timerbar ${t.urgent}" data-urgent><i data-timerbar style="transform:scaleX(${t.frac})"></i></div>`;
  if (roundKind(g) === "draw") {
    return `<div class="ex drawing">${top}
      <div class="draw-head">
        <div class="draw-word" data-key="dw-${g.turnId}-${hash(w)}-${arr(g.log).length}">🎨 Draw: <b>${esc(w)}</b></div>
        <div class="tools">
          <div class="tg">
          <div class="swatches">${Object.keys(COLORS).map(k => `<button class="sw ${S.tool === "pen" && S.color === k ? "on" : ""}" style="--c:${COLORS[k]}" data-action="color" data-c="${k}" title="${COLOR_NAMES[k]}" aria-label="${COLOR_NAMES[k]}"></button>`).join("")}</div>
          <div class="sizes">${SIZES.map(s => `<button class="chip sz ${S.tool === "pen" && S.size === s.w ? "on" : ""}" data-action="size" data-w="${s.w}" title="${s.name} line" aria-label="${s.name} line"><i style="width:${s.w === 7 ? 6 : 14}px;height:${s.w === 7 ? 6 : 14}px"></i></button>`).join("")}</div>
          </div>
          <div class="tg">
          <button class="chip ${S.tool === "eraser" ? "on" : ""}" data-action="tool" data-tool="eraser" title="Eraser">🧽<span class="lbl"> Eraser</span></button>
          <button class="chip" data-action="clear-canvas" title="Clear (Undo brings it back)">🗑<span class="lbl"> Clear</span></button>
          <button class="chip" data-action="draw-undo" title="Undo the last line">↶<span class="lbl"> Undo</span></button>
          </div>
        </div>
      </div>
      <div class="canvas-wrap mine" data-key="cv-wrap"><canvas id="cv"></canvas></div>
      ${turnControls(g)}
    </div>`;
  }
  return `<div class="ex">${top}
    <div class="cardstage">
      <div class="wordcard" data-key="card-${g.turnId}-${hash(w)}-${arr(g.log).length}">
        <div class="wc-label">Your word</div>
        <div class="wc-word ${len}">${esc(w)}</div>
        <div class="wc-rule">${ri.rule}</div>
      </div>
    </div>
    ${turnControls(g)}
  </div>`;
}

function viewWatch() {
  const { g, players, me } = ctx(); const t = timerState(g); const ri = roundInfo(g);
  const ex = players[g.explainer]; const ok = arr(g.log).filter(x => x.r === "ok");
  const drawing = roundKind(g) === "draw";
  const rel = !me?.team ? "" : me.team === g.turnTeam ? "🗣️ Your team is guessing — shout it out!" : "🤫 Other team's turn — no hints!";
  const banner = `<div class="watch-banner t-${g.turnTeam}">
      <span class="team-label t-${g.turnTeam}">${TEAMS[g.turnTeam].emoji} ${TEAMS[g.turnTeam].name}</span>
      <h2 style="margin-top:8px">${esc(ex?.name || "Someone")} is ${drawing ? "drawing" : "explaining"}</h2>
      <div class="small muted">${ri.icon} ${(g.totalRounds || 1) > 1 ? `Round ${g.round} · ` : ""}${ri.name} · ${turnLabel(g)}</div>
      ${rel ? `<div class="hint">${rel}</div>` : ""}
    </div>`;
  const all = arr(g.log), sk = all.length - ok.length;
  const live = `<div class="live-panel"><div class="live-head"><span>This turn</span><span>✓ ${ok.length} guessed · ✗ ${sk} skipped</span></div>
    <div class="live-words">${all.map((x, i) => `<span class="wchip ${x.r === "ok" ? "ok" : "skip"}" data-key="lw-${i}">${x.r === "ok" ? "✓" : "✗"} ${esc(x.w)}</span>`).join("") || `<span class="muted small">Guessed and skipped words appear here.</span>`}</div></div>`;
  if (drawing) {
    return `${teamPickBanner()}<div class="watch">${banner}
      <div class="watch-timer ${t.urgent}" data-urgent><span data-timer>${t.sec}</span>s</div>
      <div class="timerbar ${t.urgent}" data-urgent style="margin-bottom:12px"><i data-timerbar style="transform:scaleX(${t.frac})"></i></div>
      <div class="canvas-wrap" data-key="cv-wrap"><canvas id="cv"></canvas></div>
      ${live}
      ${scoreboard(g)}
    </div>`;
  }
  return `${teamPickBanner()}<div class="watch">${banner}
    <div class="ring ${t.urgent}" data-urgent>
      <svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="54"/><circle class="ring-fg" cx="60" cy="60" r="54" data-timerring style="stroke-dasharray:${RING_C};stroke-dashoffset:${RING_C * (1 - t.frac)}"/></svg>
      <div class="ring-num"><span data-timer>${t.sec}</span><small>seconds</small></div>
    </div>
    ${live}
    ${scoreboard(g)}
  </div>`;
}

function viewReview() {
  const { g, isHost } = ctx();
  const turns = arr(curRound(g).turns); const last = (g.round || 1) >= (g.totalRounds || 1);
  const nextKind = !last ? roundKind({ ...g, round: (g.round || 1) + 1 }) : null;
  const next = nextKind ? ROUNDS[nextKind] : null;
  return `<div class="grid2">
    <div class="stack">
      <div class="panel center">
        <div style="font-size:2.6rem">${last ? "🏁" : "🎆"}</div>
        <h2 style="font-size:1.8rem">${last ? "All turns done!" : `Round ${g.round} complete!`}</h2>
        <p class="muted">${isHost ? "Check the answers with everyone: tap a word to switch ✓ / ✗. ⏱ = unfinished word; tap it if the team guessed it in time. The score updates instantly." : "The host is checking the answers with everyone. Spot a mistake? Say it now! ⏱ = unfinished word."}</p>
      </div>

/* ---------- Minimal DOM morphing (keeps focus, inputs & animations stable) ---------- */
function morph(container, html) {
  const tpl = document.createElement("div"); tpl.innerHTML = html; patchChildren(container, tpl);
}
function patchChildren(a, b) {
  const an = [...a.childNodes], bn = [...b.childNodes];
  bn.forEach((y, i) => { const x = an[i]; if (!x) a.appendChild(y); else patchNode(a, x, y); });
  for (let i = bn.length; i < an.length; i++) a.removeChild(an[i]);
}
function patchNode(parent, x, y) {
  if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName ||
      (x.nodeType === 1 && x.getAttribute("data-key") !== y.getAttribute("data-key"))) { parent.replaceChild(y, x); return; }
  if (x.nodeType !== 1) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; return; }
  if (x.tagName === "CANVAS") return; // keep the drawing surface (and its pixel size) untouched
  for (const at of [...x.attributes]) if (!y.hasAttribute(at.name)) x.removeAttribute(at.name);
  for (const at of [...y.attributes]) if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
  if (x.tagName === "TEXTAREA") return; // user-owned value
  patchChildren(x, y);
}

let root;
function render() {
  if (!root) return;
  const { key, html } = view();
  morph(root, header() + `<main data-key="${key}">${S.code && S.data ? hostBanner() : ""}${html}</main>` + hostBar() + viewModal() + (S.toast ? `<div class="toast" data-key="t${S.toast.id}">${esc(S.toast.msg)}</div>` : ""));
  paintCanvas();
}

/* ---------- Timer loop ---------- */
function tick() {
  if (!S.code || !S.data) return;
  const off = hostOffline(); if (off !== S.lastHostOff) { S.lastHostOff = off; render(); }

  const { g, isHost } = ctx();
  if (g.phase === "clue") return clueTick(g);
  if (g.phase !== "turn") return;
  const t = timerState(g); const ms = remainingMs(g);
  document.querySelectorAll("[data-timer]").forEach(el => { if (el.textContent !== String(t.sec)) el.textContent = t.sec; });
  document.querySelectorAll("[data-timerbar]").forEach(el => { el.style.transform = `scaleX(${t.frac})`; });
  document.querySelectorAll("[data-timerring]").forEach(el => { el.style.strokeDashoffset = RING_C * (1 - t.frac); });
  document.querySelectorAll("[data-urgent]").forEach(el => el.classList.toggle("urgent", !!t.urgent));
  const mine = g.explainer === S.pid;
  if (mine && t.sec <= 5 && t.sec > 0 && S.lastBeep !== t.sec) { S.lastBeep = t.sec; sound("tick"); }
  // The explainer ends the turn at 0; host & others act as a fallback if the explainer's device drops.
  const grace = mine ? 0 : isHost ? 1500 : 4000;
  if (ms <= -grace && S.endRequested !== g.turnId) {
    S.endRequested = g.turnId;
    endTurn(g.turnId, "time");
  }
}

function clueTick(g) {
  const c = g.clue; if (!c || (c.step !== "write" && c.step !== "guess")) return;
  const ms = clueMsLeft(c), sec = Math.max(0, Math.ceil(ms / 1000)), total = (c.step === "write" ? g.clueTime : g.guessTime) || 60;
  document.querySelectorAll("[data-ctimer]").forEach(el => { if (el.textContent !== String(sec)) el.textContent = sec; });
  document.querySelectorAll("[data-ctimerbar]").forEach(el => { el.style.transform = `scaleX(${clamp(ms / (total * 1000), 0, 1)})`; });
  document.querySelectorAll("[data-cturgent]").forEach(el => el.classList.toggle("urgent", sec <= 10));
  const key = `${c.circle}-${c.step}`;
  if (ms <= 0 && S.clueExpiredKey !== key) {
    S.clueExpiredKey = key; render(); // host buttons light up
    const team = myClueTeam(); const T = team && c.teams[team];
    if (c.step === "write" && T && T.writer === S.pid && !T.sent) clueSend(true); // time's up: send what's typed (if it follows the rules)
    if (c.step === "guess" && T && T.writer !== S.pid && !(c.answers || {})[S.pid] && String(S.drafts.guess || "").trim()) clueAnswer();
  }
}

/* ---------- Events ---------- */
function bindEvents() {
  ["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => { unlockAudio(); keepAwake(); }, { passive: true }));
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-action]");
    if (!el || el.disabled) return;
    if (el.classList.contains("modal-bg") && e.target !== el) return;
    e.preventDefault();
    ACTIONS[el.dataset.action]?.(el.dataset, el);
  });
  document.addEventListener("input", e => {
    const el = e.target, m = el.dataset?.model; if (!m) return;
    if (m === "code") { const v = el.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4); if (el.value !== v) el.value = v; S.drafts.code = v; }
    else { S.drafts[m] = el.value; if (m === "clue") render(); }
    if (S.error && (m === "name" || m === "code")) { S.error = ""; render(); }
  });
  // Drawing (explainer only, Draw round)
  document.addEventListener("pointerdown", e => {
    const cv = e.target.closest?.("#cv"); if (!cv || !canDraw()) return;
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch {}
    const { g, d } = ctx(); const key = drawKey(g);
    if ((d.draw || {}).key !== key && S.clearedKey !== key) { S.clearedKey = key; S.db.set(roomPath("draw"), { key }); } // new word → blank canvas
    S.strokeN++;
    S.stroke = { key, id: String(Date.now()).padStart(14, "0") + String(S.strokeN).padStart(4, "0"), c: S.tool === "eraser" ? "e" : S.color, w: S.tool === "eraser" ? ERASER_W : S.size, pts: [canvasPoint(cv, e)] };
    paintCanvas(); scheduleFlush();
  });
  document.addEventListener("pointermove", e => {
    if (!S.stroke) return; const cv = document.getElementById("cv"); if (!cv) return;
    const p = canvasPoint(cv, e), l = S.stroke.pts[S.stroke.pts.length - 1];
    if (Math.abs(p[0] - l[0]) + Math.abs(p[1] - l[1]) < 4) return;
    S.stroke.pts.push(p); paintCanvas(); scheduleFlush();
  });
  ["pointerup", "pointercancel"].forEach(ev => document.addEventListener(ev, () => { if (!S.stroke) return; flushStroke(); S.stroke = null; }));
  window.addEventListener("resize", () => paintCanvas());
  document.addEventListener("submit", e => { e.preventDefault(); ACTIONS[e.target.dataset.submit]?.({}, e.target); });
  document.addEventListener("keydown", e => {
    if (S.modal) { if (e.key === "Escape") { S.modal = null; render(); } return; }
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    if (!S.data) return;
    const { g } = ctx();
    if (g.phase !== "turn" || g.explainer !== S.pid) return;
    if (e.code === "Space" || e.key === " ") { e.preventDefault(); if (!e.repeat) cardAction("ok"); }
    else if (e.key === "s" || e.key === "S") { e.preventDefault(); if (!e.repeat) cardAction("skip"); }

  });
}

function makeSnow() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.getElementById("snow"); const n = innerWidth < 600 ? 22 : 40; let h = "";
  for (let i = 0; i < n; i++) {
    const size = 6 + Math.random() * 12;
    h += `<span class="flake" style="left:${Math.random() * 100}%;font-size:${size}px;opacity:${.25 + Math.random() * .55};--dx:${(Math.random() - .5) * 160}px;animation-duration:${9 + Math.random() * 14}s;animation-delay:${-Math.random() * 20}s">${Math.random() < .5 ? "❄" : "•"}</span>`;
  }
  box.innerHTML = h;
}

/* ---------- Boot ---------- */
async function boot() {
  root = document.getElementById("app");
  root.innerHTML = "";
  bindEvents(); makeSnow();
  if (IS_CONFIGURED) {
    try { S.db = new FirebaseBackend(); await S.db.init(); }
    catch (e) { console.error(e); S.fatal = "Couldn't connect to Firebase. Check the config in the HTML file (especially databaseURL)."; S.db = new LocalBackend(); S.demo = true; }
  } else S.db = new LocalBackend();
  const room = (new URLSearchParams(location.search).get("room") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  if (room.length === 4) {
    S.drafts.code = room; S.invited = true;
    const pid = idStore().getItem("jb_pid_" + room);
    if (pid) { try { const p = await S.db.get(`rooms/${room}/players/${pid}`); if (p?.name) return enterRoom(room, pid); } catch {} }
  }
  render();
}
setInterval(tick, 200);
boot();
</script>
